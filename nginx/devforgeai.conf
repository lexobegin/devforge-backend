# nginx/devforgeai.conf
# ============================================================
# DevForge AI — Reverse proxy Nginx para el backend FastAPI
# Subdominio: api-devforgeai.duckdns.org
# Servidor:   Google Cloud Compute Engine (Ubuntu Server 24.04 LTS)
#
# Instalación típica:
#   sudo cp nginx/devforgeai.conf /etc/nginx/sites-available/devforgeai.conf
#   sudo ln -s /etc/nginx/sites-available/devforgeai.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# NOTA: con Certbot (Let's Encrypt) se recomienda dejar SOLO el bloque :80
# aquí y dejar que Certbot agregue el bloque :443 y el redirect automático.
# Este archivo incluye ya un bloque :443 comentado como referencia.
#
# Ciclo 2: la ruta WS del backend es /ws/diagramas/{diagrama_id}
# (app/websocket/collaboration_ws.py) — por eso el location /ws/ de abajo.
# ============================================================

# ----------------------------------------------------------------------
# Redirección HTTP → HTTPS (activar cuando el certificado esté emitido)
# ----------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api-devforgeai.duckdns.org;

    # Para la validación de Certbot (webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Una vez emitido el certificado, descomentar:
    # return 301 https://$host$request_uri;

    # Mientras no haya HTTPS, permitir probar el backend por HTTP:
    # client_max_body_size también aquí: los bocetos/XMI se suben por /api/v1/*
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (colaboración en tiempo real) — /ws/diagramas/{diagrama_id}
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Mantener viva la conexión WS aunque no haya tráfico
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}


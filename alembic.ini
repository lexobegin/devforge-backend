# alembic.ini
# ============================================================
# DevForge AI — Configuración de Alembic
# Migraciones de PostgreSQL para el backend FastAPI.
#
# La URL de conexión NO se define aquí: se toma desde app.config.settings
# dentro de alembic/env.py, para no duplicar credenciales ni commitear
# secretos al repositorio.
# ============================================================

[alembic]
# Ruta al directorio de scripts de migración (relativa a este archivo)
script_location = alembic

# Plantilla usada al generar nuevas revisiones
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Zona horaria usada por file_template
timezone = UTC

# Encoding de los archivos generados
output_encoding = utf-8

# `prepend_sys_path` permite que `alembic` encuentre el paquete `app`
prepend_sys_path = .

# La URL real se inyecta desde env.py
sqlalchemy.url =


# ----------------------------------------------------------------------
# Logging
# ----------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S